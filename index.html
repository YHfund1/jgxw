// ===== 超长利率债：时间序列 =====
function ulGetISOWeek(dateStr) {
  const d = new Date(dateStr); const dayNum = d.getUTCDay() || 7;
  d.setUTCDate(d.getUTCDate() + 4 - dayNum);
  const yearStart = new Date(Date.UTC(d.getUTCFullYear(), 0, 1));
  const weekNo = Math.ceil((((d - yearStart) / 86400000) + 1) / 7);
  return d.getUTCFullYear() + '-W' + String(weekNo).padStart(2, '0');
}
function ulGetWeekMonday(dateStr) {
  const d = new Date(dateStr); const dayNum = d.getUTCDay() || 7;
  d.setUTCDate(d.getUTCDate() - dayNum + 1);
  return d.getUTCFullYear() + '-' + String(d.getUTCMonth()+1).padStart(2,'0') + '-' + String(d.getUTCDate()).padStart(2,'0');
}
function ulGetMonthKey(dateStr) { return dateStr.substring(0, 7); }
function ulAdjustToWeekStart(dateStr) {
  const d = new Date(dateStr); const day = d.getDay(); const diff = day === 0 ? 6 : day - 1;
  d.setDate(d.getDate() - diff); return d.toISOString().substring(0, 10);
}
function ulAdjustToWeekEnd(dateStr) {
  const d = new Date(dateStr); const day = d.getDay(); const diff = day === 0 ? 0 : 7 - day;
  d.setDate(d.getDate() + diff); return d.toISOString().substring(0, 10);
}
function ulAdjustToMonthStart(s) { return s.substring(0, 8) + '01'; }
function ulAdjustToMonthEnd(s) { const d = new Date(s); d.setMonth(d.getMonth() + 1, 0); return d.toISOString().substring(0, 10); }

function renderUlTimeSeries() {
  if (!ulAppData) return;
  const data = ulAppData;
  const startDate = document.getElementById('ulTsStartDate').value;
  const endDate = document.getElementById('ulTsEndDate').value;
  if (!startDate || !endDate) return;
  if (startDate > endDate) { document.getElementById('ulTsHint').textContent = '起始时间不能晚于结束时间'; return; }
  document.getElementById('ulTsHint').textContent = '';
  ulTsChartInstances.forEach(c => c.dispose());
  ulTsChartInstances = [];
  _ulTsChartData.clear();
  const area = document.getElementById('ulTsChartsArea');
  area.innerHTML = '';
  const instNames = data.institutions;
  const rawTable = data.raw_table[ulTsDataType];
  if (!rawTable) return;
  for (const term of ulTsTerms) {
    const dailyMap = {};
    for (const zone of ulExpandZones(ulTsBonds)) {
      const rawZone = rawTable[zone]; if (!rawZone) continue;
      const dates = rawZone.dates;
      const termsToSum = (term === '总') ? data.terms : [term];
      for (let i = 0; i < dates.length; i++) {
        if (dates[i] >= startDate && dates[i] <= endDate) {
          if (!dailyMap[dates[i]]) dailyMap[dates[i]] = new Array(8).fill(0);
          for (const t of termsToSum) { const row = rawZone.terms[t]; if (row && row[i]) for (let j = 0; j < 8; j++) dailyMap[dates[i]][j] += (row[i][j] || 0); }
        }
      }
    }
    const dailyDates = Object.keys(dailyMap).sort();
    if (dailyDates.length === 0) continue;
    const weekStart = ulAdjustToWeekStart(startDate), weekEnd = ulAdjustToWeekEnd(endDate);
    const weeklyMap = {};
    for (const zone of ulExpandZones(ulTsBonds)) {
      const rawZone = rawTable[zone]; if (!rawZone) continue;
      const dates = rawZone.dates; const termsToSum = (term === '总') ? data.terms : [term];
      for (let i = 0; i < dates.length; i++) {
        if (dates[i] >= weekStart && dates[i] <= weekEnd) {
          const wk = ulGetWeekMonday(dates[i]);
          if (!weeklyMap[wk]) weeklyMap[wk] = new Array(8).fill(0);
          for (const t of termsToSum) { const row = rawZone.terms[t]; if (row && row[i]) for (let j=0;j<8;j++) weeklyMap[wk][j] += (row[i][j]||0); }
        }
      }
    }
    const monthStart = ulAdjustToMonthStart(startDate), monthEnd = ulAdjustToMonthEnd(endDate);
    const monthlyMap = {};
    for (const zone of ulExpandZones(ulTsBonds)) {
      const rawZone = rawTable[zone]; if (!rawZone) continue;
      const dates = rawZone.dates; const termsToSum = (term === '总') ? data.terms : [term];
      for (let i = 0; i < dates.length; i++) {
        if (dates[i] >= monthStart && dates[i] <= monthEnd) {
          const mk = ulGetMonthKey(dates[i]);
          if (!monthlyMap[mk]) monthlyMap[mk] = new Array(8).fill(0);
          for (const t of termsToSum) { const row = rawZone.terms[t]; if (row && row[i]) for (let j=0;j<8;j++) monthlyMap[mk][j] += (row[i][j]||0); }
        }
      }
    }
    const freqConfigs = [
      { key: 'daily', label: '日度', dates: dailyDates, data: dailyMap },
      { key: 'weekly', label: '周度', dates: Object.keys(weeklyMap).sort(), data: weeklyMap },
      { key: 'monthly', label: '月度', dates: Object.keys(monthlyMap).sort(), data: monthlyMap },
    ];
    const bondLabel = ulTsBonds.join('+');
    const termLabel = term === '总' ? '全部期限' : term;
    for (const fc of freqConfigs) {
      if (fc.dates.length === 0) continue;
      const tsKey = 'ul-' + term + '-' + fc.key;
      const chartId = 'ul-ts-' + tsKey;
      const tsTitle = ulTsDataType + ' · ' + bondLabel + ' · ' + termLabel + ' · ' + fc.label;
      _ulTsChartData.set(tsKey, { title: tsTitle, dates: fc.dates, instNames: instNames, data: fc.data });
      if (!_ulTsChartType.has(tsKey)) _ulTsChartType.set(tsKey, 'bar');
      const curType = _ulTsChartType.get(tsKey);
      const card = document.createElement('div');
      card.className = 'chart-card'; card.style.marginBottom = '20px';
      card.innerHTML = '<div class="chart-header"><h3>' + tsTitle + '</h3>' +
        '<div class="chart-header-right">' +
        '<div class="chart-type-group" id="ulTsTypeGroup-' + tsKey + '">' +
        '<button class="chart-type-btn' + (curType==='bar'?' active':'') + '" onclick="switchUlTsType(\'' + tsKey + '\',\'' + chartId + '\',\'bar\')">柱状图</button>' +
        '<button class="chart-type-btn' + (curType==='line'?' active':'') + '" onclick="switchUlTsType(\'' + tsKey + '\',\'' + chartId + '\',\'line\')">' + (fc.key==='daily'?'10DMA折线图':'折线图') + '</button>' +
        '<button class="chart-type-btn' + (curType==='table'?' active':'') + '" onclick="switchUlTsType(\'' + tsKey + '\',\'' + chartId + '\',\'table\')">表格</button>' +
        '</div>' +
        '<a class="download-btn" title="下载底稿" onclick="downloadUlTsByKey(\'' + tsKey + '\')"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg></a>' +
        '</div></div>' +
        '<div class="chart-container" id="' + chartId + '" style="height:420px;"></div>';
      area.appendChild(card);
      requestAnimationFrame(() => { renderUlTsByKey(tsKey, chartId, curType); });
    }
  }
  if (area.children.length === 0) {
    area.innerHTML = '<div style="text-align:center;padding:60px;color:#999;">未找到匹配数据，请调整筛选条件</div>';
  }
}

function switchUlTsType(tsKey, chartId, type) {
  _ulTsChartType.set(tsKey, type);
  const group = document.getElementById('ulTsTypeGroup-' + tsKey);
  if (group) {
    group.querySelectorAll('.chart-type-btn').forEach((btn, i) => {
      const t = ['bar','line','table'][i];
      btn.classList.toggle('active', t === type);
    });
  }
  renderUlTsByKey(tsKey, chartId, type);
}

function renderUlTsByKey(tsKey, chartId, type) {
  const entry = _ulTsChartData.get(tsKey);
  if (!entry) return;
  const el = document.getElementById(chartId);
  if (!el) return;
  const existing = echarts.getInstanceByDom(el);
  if (existing) { existing.dispose(); }
  el.innerHTML = '';
  const isDaily = tsKey.includes('-daily');
  if (type === 'table') {
    el.style.height = 'auto'; el.style.overflowX = 'auto';
    const { dates, instNames, data } = entry;
    let maxAbs = 0;
    dates.forEach(d => {
      const row = data[d] || [];
      let total = 0;
      instNames.forEach((n, j) => { const v = Math.round(row[j] || 0); total += v; if (Math.abs(v) > maxAbs) maxAbs = Math.abs(v); });
      if (Math.abs(total) > maxAbs) maxAbs = Math.abs(total);
    });
    if (maxAbs === 0) maxAbs = 1;
    let html = '<table class="ts-data-table"><thead><tr><th>日期</th>';
    instNames.forEach(n => html += '<th>' + n + '</th>');
    html += '<th>合计</th></tr></thead><tbody>';
    dates.forEach(d => {
      const row = data[d] || []; let total = 0;
      html += '<tr><td class="date-cell">' + d + '</td>';
      instNames.forEach((n, j) => {
        const v = Math.round(row[j] || 0); total += v;
        const bg = summaryBg(v, maxAbs);
        html += '<td style="' + (bg ? 'background:'+bg+';color:#000;' : 'color:#000;') + '">' + (v > 0 ? '+' : '') + v + '</td>';
      });
      const tbg = summaryBg(total, maxAbs);
      html += '<td style="' + (tbg ? 'background:'+tbg+';color:#000;font-weight:600;' : 'color:#000;font-weight:600;') + '">' + (total > 0 ? '+' : '') + total + '</td></tr>';
    });
    html += '</tbody></table>';
    el.innerHTML = html;
  } else {
    el.style.height = '420px';
    const inst = echarts.init(el, null, { renderer: 'canvas' });
    ulTsChartInstances.push(inst);
    const { dates, instNames, data } = entry;
    const isBar = type === 'bar'; const use10DMA = !isBar && isDaily;
    const series = [], legendData = [];
    instNames.forEach((instName, j) => {
      const rawVals = dates.map(d => { const row = data[d]; return row ? Math.round((row[j] || 0) * 100) / 100 : 0; });
      let vals;
      if (use10DMA) {
        vals = rawVals.map((v, i) => {
          if (i < 9) return null;
          return Math.round(rawVals.slice(i - 9, i + 1).reduce((a, b) => a + b, 0) / 10 * 100) / 100;
        });
      } else { vals = rawVals; }
      series.push({ name: instName, type: isBar ? 'bar' : 'line', stack: isBar ? 'total' : undefined, data: vals,
        itemStyle: { color: ulInstColors[j] }, lineStyle: isBar ? undefined : { width: 1.5 },
        symbol: isBar ? undefined : 'none', emphasis: { focus: 'series' }, connectNulls: false });
      legendData.push(instName);
    });
    inst.setOption({
      tooltip: { trigger: 'axis', backgroundColor: 'rgba(30,30,50,0.92)', borderColor: 'transparent', textStyle: { color: '#fff', fontSize: 12 },
        formatter(params) {
          let h = '<b style="color:#ddd">' + params[0].axisValue + '</b><br/>'; let total = 0;
          params.forEach(p => { if (p.value != null && p.value !== 0) { h += p.marker + ' ' + p.seriesName + ': <b>' + p.value.toFixed(2) + '</b> 亿<br/>'; total += p.value; } });
          if (total !== 0) h += '<span style="color:#faad14">合计: <b>' + total.toFixed(2) + '</b> 亿</span>';
          return h;
        }
      },
      legend: { data: legendData, top: 0, textStyle: { fontSize: 11 }, itemWidth: 16, itemHeight: 10, itemStyle: { borderWidth: 0 }, selectedMode: true },
      grid: { left: 60, right: 20, top: 40, bottom: 65 },
      xAxis: { type: 'category', data: dates, boundaryGap: isBar,
        axisLabel: { interval: Math.max(0, Math.floor(dates.length / 20)), fontSize: 10, color: '#aaa', rotate: 45 },
        axisLine: { lineStyle: { color: '#e0e0e0' } }, axisTick: { show: false }
      },
      yAxis: { type: 'value', name: '亿元', axisLabel: { fontSize: 10, color: '#aaa', formatter: v => v.toFixed(0) },
        splitLine: { lineStyle: { color: '#f0f0f0', type: 'dashed' } }, axisLine: { show: false }
      },
      dataZoom: [{ type: 'inside' }, { type: 'slider', height: 20, bottom: 8 }],
      series
    });
  }
}

function downloadUlTsByKey(key) {
  const entry = _ulTsChartData.get(key);
  if (!entry) return;
  const headers = ['\u65e5\u671f'].concat(entry.instNames);
  const rows = [];
  for (const d of entry.dates) {
    const row = [d]; const rowData = entry.data[d];
    for (let j = 0; j < entry.instNames.length; j++) { row.push(rowData ? Math.round((rowData[j] || 0) * 100) / 100 : 0); }
    rows.push(row);
  }
  const safeName = entry.title.replace(/[\u00b7\s]+/g, '_');
  const BOM = '\uFEFF';
  let csv = BOM + headers.join(',') + '\n';
  rows.forEach(row => { csv += row.map(v => v === null || v === undefined ? '' : v).join(',') + '\n'; });
  const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
  const link = document.createElement('a');
  link.href = URL.createObjectURL(blob); link.download = safeName + '.csv';
  document.body.appendChild(link); link.click(); document.body.removeChild(link);
}

window.addEventListener('resize', () => { chartInstances.forEach(c => c.resize()); tsChartInstances.forEach(c => c.resize()); ulChartInstances.forEach(c => c.resize()); ulTsChartInstances.forEach(c => c.resize()); });

// ===== 超长债分期限统计表 =====
let ulTableReady = false;
let ulTableMinDate = null;

const ulTableSections = [
  { title: '国债',   mainKey: '国债',   ulNewKey: '国债-新债', ulOldKey: '国债-老债' },
  { title: '政金债', mainKey: '政金债', ulNewKey: '政金债-新债', ulOldKey: '政金债-老债' },
  { title: '地方债', mainKey: '地方债', ulNewKey: '地方政府债', ulOldKey: null },
];
const ulTableInstHeaders = ['大型银行','中小型银行','证券公司','保险公司','基金公司及产品','理财类产品','货币基金','其他'];
const ulTableShortTerms = ['1Y以下','1-3Y','3-5Y','5-7Y','7-10Y'];
const ulTableUltraGroups = [
  { label: '10-20Y',   sources: ['10-15Y','15-20Y'] },
  { label: '20-30Y',   sources: ['20-30Y'] },
  { label: '30年以上', sources: ['30年以上'] },
];

function ulTableSumMain(bondKey, termName, startDate, endDate) {
  const raw = appData.raw_table[bondKey];
  if (!raw) return new Array(8).fill(0);
  const dates = raw.dates, values = raw.terms[termName];
  if (!values) return new Array(8).fill(0);
  const sum = new Array(8).fill(0);
  for (let i = 0; i < dates.length; i++) {
    if (dates[i] >= startDate && dates[i] <= endDate) {
      for (let j = 0; j < 8; j++) sum[j] += (values[i][j] || 0);
    }
  }
  return sum.map(v => Math.round(v * 100) / 100);
}

function ulTableSumUl(zoneKey, termName, startDate, endDate) {
  const raw = ulAppData.raw_table['净买入'];
  if (!raw) return new Array(8).fill(0);
  const zone = raw[zoneKey];
  if (!zone) return new Array(8).fill(0);
  const dates = zone.dates, values = zone.terms[termName];
  if (!values) return new Array(8).fill(0);
  const sum = new Array(8).fill(0);
  for (let i = 0; i < dates.length; i++) {
    if (dates[i] >= startDate && dates[i] <= endDate) {
      for (let j = 0; j < 8; j++) sum[j] += (values[i][j] || 0);
    }
  }
  return sum.map(v => Math.round(v * 100) / 100);
}

function ulTableSumMerged(newKey, oldKey, termName, startDate, endDate) {
  const a = ulTableSumUl(newKey, termName, startDate, endDate);
  if (oldKey) {
    const b = ulTableSumUl(oldKey, termName, startDate, endDate);
    for (let i = 0; i < 8; i++) a[i] = Math.round((a[i] + b[i]) * 100) / 100;
  }
  return a;
}

function ulTableCompute(startDate, endDate, prevStart, prevEnd) {
  const rows = [];
  const grandCur = new Array(8).fill(0), grandPrev = new Array(8).fill(0);

  for (const sec of ulTableSections) {
    for (const term of ulTableShortTerms) {
      const cur = ulTableSumMain(sec.mainKey, term, startDate, endDate);
      const prev = ulTableSumMain(sec.mainKey, term, prevStart, prevEnd);
      rows.push({ label: term, values: cur, prevValues: prev, isUltraRow: false, section: sec.title });
      for (let j = 0; j < 8; j++) { grandCur[j] += cur[j]; grandPrev[j] += prev[j]; }
    }
    for (const group of ulTableUltraGroups) {
      const cur = new Array(8).fill(0), prev = new Array(8).fill(0);
      for (const srcTerm of group.sources) {
        const c = ulTableSumMerged(sec.ulNewKey, sec.ulOldKey, srcTerm, startDate, endDate);
        const p = ulTableSumMerged(sec.ulNewKey, sec.ulOldKey, srcTerm, prevStart, prevEnd);
        for (let j = 0; j < 8; j++) { cur[j] = Math.round((cur[j] + c[j]) * 100) / 100; prev[j] = Math.round((prev[j] + p[j]) * 100) / 100; }
      }
      rows.push({ label: group.label, values: cur, prevValues: prev, isUltraRow: true, section: sec.title });
      for (let j = 0; j < 8; j++) { grandCur[j] += cur[j]; grandPrev[j] += prev[j]; }
    }
  }

  let maxAbs = 0;
  for (const r of rows) {
    for (let j = 0; j < 8; j++) {
      maxAbs = Math.max(maxAbs, Math.abs(r.values[j]), Math.abs(r.prevValues[j] || 0));
    }
  }
  maxAbs = Math.max(maxAbs, ...grandCur.map(Math.abs), ...grandPrev.map(Math.abs));
  return { rows, grandCur, grandPrev, maxAbs };
}

function renderUlTable2() {
  if (!ulTableReady) return;
  const startDate = document.getElementById('ulTableStartDate').value;
  const endDate = document.getElementById('ulTableEndDate').value;
  const prevStart = document.getElementById('ulTablePrevStartDate').value;
  const prevEnd = document.getElementById('ulTablePrevEndDate').value;
  if (!startDate || !endDate || !prevStart || !prevEnd) return;

  const result = ulTableCompute(startDate, endDate, prevStart, prevEnd);
  const { rows, grandCur, grandPrev, maxAbs } = result;

  let html = '<tbody>';
  let currentSection = null;
  for (const row of rows) {
    if (row.section !== currentSection) {
      currentSection = row.section;
      html += `<tr class="section-row"><td class="sec-title">${currentSection}</td>`;
      ulTableInstHeaders.forEach(h => html += `<td class="sec-inst">${h}</td>`);
      html += '</tr>';
    }
    html += '<tr>';
    html += `<td class="sub-cell">${row.label}</td>`;
    for (let j = 0; j < 8; j++) {
      const text = fmtText(row.values[j]);
      const bg = summaryBg(row.values[j], maxAbs);
      html += `<td style="${bg ? 'background:'+bg+';color:#000;' : 'color:#000;'}">${text}</td>`;
    }
    html += '</tr>';
  }

  html += '<tr class="section-row"><td class="sec-title">汇总</td>';
  ulTableInstHeaders.forEach(h => html += `<td class="sec-inst">${h}</td>`);
  html += '</tr>';
  html += `<tr class="summary-row"><td class="cat-cell">本期净买入（${startDate.replace(/-/g,'/')}-${endDate.replace(/-/g,'/')}）</td>`;
  for (let j = 0; j < 8; j++) {
    const v = Math.round(grandCur[j]*100)/100;
    const bg = summaryBg(v, maxAbs);
    html += `<td style="${bg ? 'background:'+bg+';color:#000;' : 'color:#000;'}">${fmtText(v)}</td>`;
  }
  html += '</tr>';
  html += `<tr class="summary-row"><td class="cat-cell">上期净买入（${prevStart.replace(/-/g,'/')}-${prevEnd.replace(/-/g,'/')}）</td>`;
  for (let j = 0; j < 8; j++) {
    const v = Math.round(grandPrev[j]*100)/100;
    const bg = summaryBg(v, maxAbs);
    html += `<td style="${bg ? 'background:'+bg+';color:#000;' : 'color:#000;'}">${fmtText(v)}</td>`;
  }
  html += '</tr>';
  html += '</tbody>';
  document.getElementById('ulDataTable').innerHTML = html;
}

function applyUlTableDateRange() {
  let startDate = document.getElementById('ulTableStartDate').value;
  let endDate = document.getElementById('ulTableEndDate').value;
  let prevStart = document.getElementById('ulTablePrevStartDate').value;
  let prevEnd = document.getElementById('ulTablePrevEndDate').value;
  if (!startDate || !endDate || !prevStart || !prevEnd) return;

  if (ulTableMinDate) {
    if (startDate < ulTableMinDate) { startDate = ulTableMinDate; document.getElementById('ulTableStartDate').value = startDate; }
    if (endDate < ulTableMinDate) { endDate = ulTableMinDate; document.getElementById('ulTableEndDate').value = endDate; }
    if (prevStart < ulTableMinDate) { prevStart = ulTableMinDate; document.getElementById('ulTablePrevStartDate').value = prevStart; }
    if (prevEnd < ulTableMinDate) { prevEnd = ulTableMinDate; document.getElementById('ulTablePrevEndDate').value = prevEnd; }
  }

  if (startDate > endDate) { document.getElementById('ulTableDateHint').textContent = '⚠ 起始时间不能晚于结束时间'; return; }
  if (prevStart > prevEnd) { document.getElementById('ulTablePrevDateHint').textContent = '⚠ 上期时间无效'; return; }
  document.getElementById('ulTableDateHint').textContent = '';
  document.getElementById('ulTablePrevDateHint').textContent = '';

  renderUlTable2();
}

// 初始化超长债分期限统计表（在 ultra_long_data.json 加载完成后调用）
function initUlTable() {
  if (!appData || !ulAppData) return;
  ulTableMinDate = ulAppData.all_dates[0];
  const maxDate = appData.all_dates[appData.all_dates.length - 1];
  const clamp = (v) => (v < ulTableMinDate ? ulTableMinDate : v);

  document.getElementById('ulTableStartDate').value = clamp(appData.default_start);
  document.getElementById('ulTableEndDate').value = appData.default_end;
  document.getElementById('ulTableStartDate').min = ulTableMinDate;
  document.getElementById('ulTableStartDate').max = maxDate;
  document.getElementById('ulTableEndDate').min = ulTableMinDate;
  document.getElementById('ulTableEndDate').max = maxDate;
  document.getElementById('ulTablePrevStartDate').value = clamp(appData.default_start);
  document.getElementById('ulTablePrevEndDate').value = appData.default_end;
  document.getElementById('ulTablePrevStartDate').min = ulTableMinDate;
  document.getElementById('ulTablePrevStartDate').max = maxDate;
  document.getElementById('ulTablePrevEndDate').min = ulTableMinDate;
  document.getElementById('ulTablePrevEndDate').max = maxDate;
  ulTableReady = true;
}
